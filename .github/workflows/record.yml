name: Record Live Stream

on:
  schedule:
    - cron: '50 16 * * *'
  workflow_dispatch:

jobs:
  record-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Wait for and Record Stream
        run: |
          echo "Checking playlist for an active live stream..."
          for i in {1..60}; do
            LIVE_ID=$(yt-dlp --print id --match-filter "is_live" "https://youtube.com/playlist?list=PLUHokAA_R9EA" 2>/dev/null | head -n 1 || true)
            
            if [ -n "$LIVE_ID" ]; then
              echo "Stream is LIVE! (ID: $LIVE_ID). Starting recording..."
              # ADDED: -S "res:1080" to prevent 4K streams from exhausting GitHub's 14GB disk limit.
              # ADDED: || true so the script doesn't abort if yt-dlp exits with an error when the stream naturally ends.
              yt-dlp --live-from-start -S "res:1080" "https://www.youtube.com/watch?v=$LIVE_ID" -o "MMOC_Stream.%(ext)s" || true
              exit 0
            fi
            
            echo "Nothing is live right now. Checking again in 60 seconds... (Attempt $i/60)"
            sleep 60
          done
          echo "No stream went live within 60 minutes."
          exit 1

      - name: Upload Video for Download
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorded-session
          path: MMOC_Stream*.*
