name: Record Live Stream

on:
  schedule:
    - cron: '50 16 * * *'
  workflow_dispatch:

jobs:
  record-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Wait for and Record Stream
        run: |
          # Store your specific YouTube link in a variable
          TARGET_URL="https://https://www.youtube.com/live/Sf-Ux8k9xTc?si=4bzS_ZookefJdpKr"
          
          echo "Checking specific URL for an active live stream..."
          
          for i in {1..60}; do
            # Check if this specific video is currently live
            LIVE_ID=$(yt-dlp --print id --match-filter "is_live" "$TARGET_URL" 2>/dev/null || true)
            
            if [ -n "$LIVE_ID" ]; then
              echo "Stream is LIVE! (ID: $LIVE_ID). Starting recording..."
              # Record at max 1080p to save GitHub disk space, and allow graceful exit if stream drops
              yt-dlp --live-from-start -S "res:1080" "$TARGET_URL" -o "MMOC_Stream.%(ext)s" || true
              exit 0
            fi
            
            echo "Stream is not live yet. Checking again in 60 seconds... (Attempt $i/60)"
            sleep 60
          done
          echo "Stream did not go live within 60 minutes."
          exit 1

      - name: Upload Video for Download
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorded-session
          path: MMOC_Stream*.*
