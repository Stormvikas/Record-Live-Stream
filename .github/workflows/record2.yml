name: Record Sample Stream (10 Mins)

on:
  workflow_dispatch:

jobs:
  record-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Record Stream for 10 Minutes
        run: |
          echo "Starting 10-minute recording in 1080p..."
          
          # timeout 600s forcefully stops yt-dlp after exactly 10 minutes.
          # || true prevents GitHub from failing the step when the timeout interrupts the download.
          timeout 600s yt-dlp -S "res:1080" "https://www.youtube.com/live/qO6zdFBmFTc" -o "Sample_Stream.%(ext)s" || true
          
          echo "10-minute recording complete."

      - name: Upload Video for Download
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorded-sample
          path: Sample_Stream*.*
